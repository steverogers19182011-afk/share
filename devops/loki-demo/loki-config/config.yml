---
auth_enabled: false
common:
  compactor_address: loki
  path_prefix: "/var/loki/loki"
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
  storage:
    filesystem:
      chunks_directory: "/var/loki/loki/chunks"
      rules_directory: "/var/loki/loki/rules"
compactor:
  working_directory: "/var/loki/loki/compactor"
  shared_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
frontend:
  max_outstanding_per_tenant: 4096
limits_config:
  retention_period: 3d
  ingestion_rate_mb: 100
  ingestion_burst_size_mb: 100
  per_stream_rate_limit: 100MB
  per_stream_rate_limit_burst: 100MB
  enforce_metric_name: false
  max_cache_freshness_per_query: 10m
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  split_queries_by_interval: 15m
memberlist:
  join_members:
  - loki-memberlist
query_range:
  parallelise_shardable_queries: true
  align_queries_with_step: true
query_scheduler:
  max_outstanding_requests_per_tenant: 4096
ruler:
  storage:
    local:
      directory: "/var/loki/loki/rules"
    type: local
runtime_config:
  file: "/etc/loki/runtime-config/runtime-config.yaml"
schema_config:
  configs:
  - from: '2020-01-01'
    index:
      period: 24h
      prefix: loki_index_
    object_store: filesystem
    schema: v11
    store: boltdb-shipper
server:
  grpc_listen_port: 9095
  http_listen_port: 3100
storage_config:
  filesystem:
    directory: "/var/loki/loki/chunks"
  boltdb_shipper:
    cache_ttl: 24h
    shared_store: filesystem
table_manager:
  retention_deletes_enabled: false
  retention_period: 60d
