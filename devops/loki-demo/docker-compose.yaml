version: "3.8"

networks:
  loki: {}

services:
  loki:
    image: grafana/loki:2.9.8
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"          # HTTP
    expose:
      - "9095"               # gRPC (internal only)
      - "7946"               # memberlist gossip (tcp/udp, internal)
    networks:
      loki:
        aliases:
          - loki             # compactor_address = loki
          - loki-memberlist  # memberlist.join_members includes this name
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./loki-config:/etc/loki              # holds config.yml + runtime-config/
      - ./loki-data:/var/loki/loki           # <-- bind to subdir to avoid perms on /var/loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  grafana:
      environment:
          - GF_SECURITY_ADMIN_USER=admin
          - GF_SECURITY_ADMIN_PASSWORD=12345678
          - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
          - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
          - GF_USERS_ALLOW_SIGN_UP=false
          - GF_AUTH_DISABLE_LOGIN_FORM=false
          - GF_FEATURE_TOGGLES_ENABLE=alertingSimplifiedRouting,alertingQueryAndExpressionsStepMode
      entrypoint:
          - sh
          - -euc
          - |
              mkdir -p /etc/grafana/provisioning/datasources
              cat <<EOF > /etc/grafana/provisioning/datasources/ds.yaml
              apiVersion: 1
              datasources:
              - name: Loki
                type: loki
                access: proxy
                orgId: 1
                url: http://loki:3100
                basicAuth: false
                isDefault: true
                version: 1
                editable: false
              EOF
              /run.sh
      image: grafana/grafana:latest
      ports:
          - "3000:3000"
      networks:
          - loki
